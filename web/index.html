<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ava — Speech Therapy Coach (Realtime)</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>🗣️ Ava — Speech Therapy Coach (Realtime)</h1>
      <p>Practice fluency and pronunciation with quick feedback. Choose a mode, add an optional target sentence for <strong>Phonological</strong>, then <strong>Connect</strong>, <strong>Record</strong>, and <strong>Stop</strong> to hear coaching and see transcripts.</p>

      <div class="controls">
        <label for="modeSelect">Mode</label>
        <select id="modeSelect">
          <option value="stutter" selected>Stutter (fluency)</option>
          <option value="phonological">Phonological (targeted script)</option>
        </select>

        <textarea id="instructions" rows="6" placeholder="Optional: custom session instructions (tone, rubric, goals)..."></textarea>
        <div id="targetScriptRow" style="display:none">
          <textarea id="targetScript" rows="4" placeholder="Targeted transcript (phonological mode)"></textarea>
        </div>
        <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
          <button id="connectBtn">Connect</button>
          <button id="recordBtn" disabled>Record</button>
          <button id="stopBtn" disabled>Stop</button>
          <button id="replayBtn" disabled>Replay Last Take</button>
          <button id="hangupBtn" disabled>Hang Up</button>
        </div>
        <div class="vu-row">
          <span class="muted">Mic level:</span>
          <div id="vu" class="vu"><div id="vuBar" class="vu-bar"></div></div>
          <audio id="userPlayback" controls class="user-audio" style="display:none"></audio>
        </div>
      </div>

      <section class="audio">
        <div>
          <h3>Assistant</h3>
          <audio id="assistantAudio" autoplay controls></audio>
        </div>
      </section>

      <section class="log">
        <h3>Status</h3>
        <pre id="log"></pre>
      </section>

      <section>
        <h3>Feedback</h3>
        <div id="feedback" class="feedback"></div>
      </section>
    </main>

    <script src="client.js"></script>
  </body>
</html>
