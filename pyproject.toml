[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ava-speech-therapy-coach"
version = "0.1.0"
description = "A voice-first speech therapy practice agent using OpenAI Realtime + structured feedback."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "python-dotenv>=1.0.1",
  "pydantic>=2.8.2",
  "openai>=1.51.0",
  "requests>=2.32.3",
  "numpy>=2.1.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
